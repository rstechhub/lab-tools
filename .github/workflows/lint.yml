name: lint

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning `
                 -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($r | Where-Object Severity -eq 'Error') { throw "PSScriptAnalyzer found errors" }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck linux/*.sh truenas/*.sh esx-kickstart/*.sh
