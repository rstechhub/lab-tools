# ESX 9.x kickstart for a physical VCF host
# Tokens in {{ }} are filled in per host by build-ks-isos.sh - do not edit them here.
# The generated KS.CFG contains the root password: keep it off Git; the ISOs are deleted after each run.

vmaccepteula

# Wipe the partition table of EVERY local disk (boot disk, old VMFS, old vSAN), so the host starts clean
# and the vSAN drives are empty for the VCF bring-up. Install-EsxKickstart.ps1 asks for confirmation first.
clearpart --alldrives --overwritevmfs

# Install ESX on the disk model chosen for this host
install --firstdisk={{BOOTDISK}} --overwritevmfs

rootpw {{ROOTPW}}

keyboard '{{KEYBOARD}}'

# Management network: tagged VLAN, uplink chosen by MAC address
network --bootproto=static --device={{MAC}} --ip={{IP}} --netmask={{NETMASK}} --gateway={{GATEWAY}} --nameserver={{DNS}} --hostname={{FQDN}} --vlanid={{VLAN}} --addvmportgroup=0

reboot

%firstboot --interpreter=busybox

# DNS search domain and NTP (VCF checks both)
esxcli network ip dns search add --domain={{DOMAIN}}
esxcli system ntp set {{NTPARGS}} --enabled=true

# SSH on (VCF Installer needs it), shell warnings off
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Management PC's public key for root, so the install script can run its readiness checks
{{SSHKEYCMD}}

# MTU on the standard switch and vmk0 (9000 for jumbo frames end to end before the VCF bring-up)
esxcli network vswitch standard set -v vSwitch0 -m {{MTU}}
esxcli network ip interface set -i vmk0 -m {{MTU}}

# IPv6 off (takes effect after the reboot below)
esxcli network ip set --ipv6-enabled=false

# Host certificate must carry the FQDN, not localhost.localdomain
/sbin/generate-certificates

reboot
